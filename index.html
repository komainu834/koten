<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>古典単語タイムアタック</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>古典単語タイムアタック</h1>

    <section id="homeScreen" class="card">
  <h2>古典単語タイムアタック</h2>
  <button id="goStartBtn">スタート画面へ</button>
</section>

<section id="startScreen" class="card hidden"></section>

    <section id="startScreen" class="card">
      <p>60秒で何問正解できるか挑戦！</p>
      <input id="username" placeholder="ユーザー名を入力" />
      <button id="startBtn">スタート</button>
    </section>

    <section id="quizScreen" class="card hidden">
      <div class="status">
        <div>残り時間：<span id="time">60</span>秒</div>
        <div>正解数：<span id="score">0</span></div>
      </div>

      <div class="question">
        <p>この古典単語の意味は？</p>
        <h2 id="word">---</h2>
      </div>

      <div id="choices" class="choices"></div>

      <p id="feedback" class="feedback"></p>
    </section>

  <section id="resultScreen" class="card hidden">
  <h2>結果</h2>
  <p><span id="finalScore">0</span>問正解！</p>

  <h3>ランキング</h3>
  <ol id="rankingList"></ol>

  <button id="retryBtn">もう一度</button>
</section>
  </main>

  <script src="app.js"></script>
</body>
</html>
