<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>古典語彙タイムアタック</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- メニュー -->
  <button id="menuButton" class="menu-button">☰</button>

  <div id="overlay" class="overlay"></div>

  <nav id="sideMenu" class="side-menu">
    <button id="closeMenu" class="close-button">×</button>
    <button onclick="goHome()">古典問題</button>
    <button onclick="showRanking()">ランキング</button>
  </nav>

  <!-- ホーム -->
  <section id="homeScreen" class="screen active">
    <h1>古典語彙タイムアタック</h1>
    <input id="loginId" placeholder="ログインID" readonly>
    <input id="username" placeholder="ユーザーネーム">
    <button onclick="startGame()">スタート</button>
  </section>

  <!-- ゲーム -->
  <section id="gameScreen" class="screen">
    <div>TIME：<span id="time">60</span></div>
    <div>SCORE：<span id="score">0</span></div>

    <p id="question"></p>
    <div id="choices"></div>

    <div id="judgeMark"></div>
    <div id="comboText"></div>
    <div id="scorePlus" class="score-plus"></div>
    <div id="goText" class="go-text">GO!!</div>
  </section>

  <!-- 結果 -->
  <section id="resultScreen" class="screen">
    <h2>結果</h2>
    <p id="finalScore"></p>

    <button onclick="startGame()">もう一度</button>
    <button onclick="goHome()">ホーム</button>
  </section>

  <!-- ランキング -->
  <section id="rankingScreen" class="screen">
    <h2>ランキング</h2>
    <ol id="rankingList"></ol>
    <button onclick="goHome()">戻る</button>
  </section>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
