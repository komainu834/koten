<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>古典語彙タイムアタック</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- メニュー -->
  <button id="menuButton" class="menu-button">☰</button>

  <div id="overlay" class="overlay"></div>

  <nav id="sideMenu" class="side-menu">
    <button id="closeMenu" class="close-button">×</button>
    <button onclick="showVocabHome()">古典語彙</button>
    <button onclick="showTestScreen()">📝 テスト</button>
    <button onclick="showRanking()">🏆 ランキング</button>

    <div class="profile-area">
      <button onclick="openProfile()" class="profile-btn">プロフィール</button>
    </div>

  </nav>

  <section id="topScreen" class="screen active">
  <h1>古典タイムアタック</h1>

<div class="menu-buttons">
  <button onclick="showVocabHome()">古典語彙</button>
  <button onclick="showTestScreen()">📝 テスト</button>
  <button onclick="showRanking()">🏆 ランキング</button>
</div>
</section>

  <!-- ホーム -->
  <section id="homeScreen" class="screen">
  <h1>古典語彙タイムアタック</h1>
  <button onclick="startGame()">スタート</button>
</section>

  <!-- ゲーム -->
  <section id="gameScreen" class="screen">
    <div>TIME：<span id="time">60</span></div>
    <div>SCORE：<span id="score">0</span></div>

    <div class="combo-gauge-wrap">
    <div class="combo-gauge-bg">
    <div class="combo-marker marker-0"><span>START</span></div>

  <div id="comboGauge" class="combo-gauge-fill"></div>

  <div class="combo-marker marker-10"><span>3秒追加</span></div>
  <div class="combo-marker marker-20"><span>3秒追加</span></div>
  <div class="combo-marker marker-30"><span>3秒追加</span></div>
  <div class="combo-marker marker-40"><span>3秒追加</span></div>
</div>
</div>

    <p id="question"></p>
    <div id="choices"></div>

    <div id="judgeMark"></div>
    <div id="comboText"></div>
    <div id="scorePlus" class="score-plus"></div>
    <div id="goText" class="go-text">GO!!</div>
  </section>

  <!-- 結果 -->
  <section id="resultScreen" class="screen">
  <h2>結果発表</h2>

  <div class="result-card">
    <p class="result-label">SCORE</p>
    <p class="result-score"><span id="finalScore"></span></p>
  </div>

  <div class="menu-buttons">
    <button class="btn-vocab" onclick="startGame()">▶ もう一度</button>
    <button class="btn-ranking" onclick="goTop()">🏠 ホーム</button>
  </div>
</section>

  <!-- ランキング -->
  <section id="rankingScreen" class="screen">
    <h2>ランキング</h2>
    <ol id="rankingList"></ol>
    <button onclick="goHome()">戻る</button>
  </section>

  <section id="testScreen" class="screen">
  <h2>テスト</h2>
  <button onclick="goTop()">戻る</button>
</section>

  <section id="profileScreen" class="screen">
  <h2>プロフィール</h2>

  <p>ID（変更不可）</p>
  <input id="profileId" readonly>

  <p>ユーザーネーム（変更可）</p>
  <input id="profileName">

  <button onclick="saveProfile()">保存</button>
  <button onclick="goHome()">戻る</button>
</section>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
