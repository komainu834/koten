<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>古典語彙タイムアタック</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="menuButton" class="menu-button">☰</button>

  <div id="overlay" class="overlay"></div>

  <nav id="sideMenu" class="side-menu">
    <button id="closeMenu" class="close-button">×</button>
    <button onclick="goHome()">古典問題</button>
    <button onclick="showRanking()">ランキング</button>
  </nav>

  <section id="homeScreen" class="screen active">
    <h1>古典語彙<br>タイムアタック</h1>
    <p>制限時間内にたくさん答えよう！</p>

    <input id="username" type="text" placeholder="ユーザー名を入力">

    <button class="main-button" onclick="startGame()">スタート</button>
    <button class="sub-button" onclick="showRanking()">ランキングを見る</button>
  </section>

  <section id="gameScreen" class="screen">
    <div class="status">
      <div>TIME：<span id="time">30</span></div>
      <div>SCORE：<span id="score">0</span></div>
    </div>

    <div id="comboText" class="combo-text"></div>

    <div class="question-box">
      <p id="question"></p>
    </div>

    <div id="choices" class="choices"></div>
    <div id="judgeMark" class="judge-mark"></div>
  </section>

  <section id="resultScreen" class="screen">
    <h2>結果発表</h2>
    <p class="result-score">スコア：<span id="finalScore">0</span></p>

    <button class="main-button" onclick="startGame()">もう一度</button>
    <button class="sub-button" onclick="goHome()">ホームに戻る</button>
  </section>

  <section id="rankingScreen" class="screen">
    <h2>ランキング</h2>
    <ol id="rankingList"></ol>

    <button class="sub-button" onclick="goHome()">ホームに戻る</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
